[build-system]
requires = ["setuptools>=75", "wheel", "Cython>=3", "numpy>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "fdtdmesh"
version = "0.6.0"
description = "Conformal enlarged-cell TMz PEC scattering on nonuniform grids"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.14", "h5py>=3.11"]

[project.optional-dependencies]
cnn = ["onnxruntime>=1.20"]

[dependency-groups]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "matplotlib>=3.11.2"]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "Cython>=3",
    "setuptools>=75",
    "wheel",
    "matplotlib>=3.11.2",
    "onnx>=1.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fdtdmesh = ["solver/*.pyx", "solver/cuda/*.h", "solver/cuda/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["cuda: requires the compiled extension and a CUDA GPU"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
