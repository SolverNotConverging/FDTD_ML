[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scattermesh"
version = "0.1.0"
description = "Mesh CNN v2 for nonuniform conformal FDTD scattering grids"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.14"]

[project.optional-dependencies]
cuda = ["torch>=2.4", "Cython>=3.3"]

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.9", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
